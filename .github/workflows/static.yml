# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        # Publish only what the site serves. Uploading the repository root also
        # published the maintenance scripts under tools/ and any stray data
        # export left in the working tree.
        run: |
          mkdir -p _site
          cp index.html site.webmanifest _site/
          cp favicon.ico favicon-16x16.png favicon-32x32.png _site/
          cp apple-touch-icon.png android-chrome-192x192.png android-chrome-512x512.png _site/
          cp archive.json _site/
          cp -r src _site/
          cp -r calendar _site/
      - name: Verify no absolute paths are published
        # The catalog is world-readable. Absolute Windows paths in it would
        # expose the maintainer's local disk layout, so fail the deploy rather
        # than ship one.
        run: |
          if grep -qE '"[A-Za-z]:\\\\' _site/archive.json; then
            echo "::error::archive.json contains absolute drive paths; regenerate it with tools/Build-Archive.ps1"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
